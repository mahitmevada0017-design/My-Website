<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag | Orion Audio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fff;
      color: #1d1c1f;
      line-height: 1.6;
      min-height: 100vh;
    }

    body.dark { background: #101010; color: #f5f5f7; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 5%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      transition: all 0.3s;
    }

    body.dark .navbar {
      background: rgba(20, 20, 22, 0.8);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo a {
      font-size: 1.6rem;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #333, #000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.dark .logo a {
      background: linear-gradient(135deg, #eee, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: inherit;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }

    .dark-toggle {
      background: none;
      border: none;
      color: inherit;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .page-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      text-align: center;
      margin: 3rem 0 2rem;
      font-weight: 700;
    }

    .cart-section {
      padding: 2rem 5%;
      min-height: 70vh;
    }

    .cart-container {
      max-width: 1200px;
      margin: 2rem auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
    }

    .cart-items {
      background: #f9f9fb;
      padding: 2rem;
      border-radius: 32px;
    }

    body.dark .cart-items { background: #1d1d20; }

    .cart-item {
      display: grid;
      grid-template-columns: 80px 1fr auto auto auto;
      gap: 1.5rem;
      align-items: center;
      padding: 1.5rem;
      background: white;
      border-radius: 24px;
      margin-bottom: 1rem;
      transition: all 0.3s;
    }

    .cart-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }

    body.dark .cart-item { background: #222225; }

    .cart-item-image {
      font-size: 3rem;
      text-align: center;
    }

    .cart-item-details h3 {
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }

    .cart-item-details p {
      color: #6e6e73;
      font-size: 0.9rem;
    }

    .cart-item-price {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #f5f5f7;
      padding: 0.5rem;
      border-radius: 50px;
    }

    body.dark .cart-item-quantity { background: #1a1a1e; }

    .cart-item-quantity button {
      width: 32px;
      height: 32px;
      border: none;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .cart-item-quantity button:hover {
      background: #667eea;
      color: white;
      transform: scale(1.1);
    }

    body.dark .cart-item-quantity button { 
      background: #2a2a2e;
      color: #f5f5f7;
    }

    .cart-item-total {
      font-weight: 700;
      font-size: 1.2rem;
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: #6e6e73;
      font-size: 1.3rem;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s;
    }

    .cart-item-remove:hover {
      opacity: 1;
      color: #ff3b30;
      transform: scale(1.2);
    }

    .empty-cart {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-cart i {
      font-size: 4rem;
      opacity: 0.3;
      margin-bottom: 1rem;
    }

    .empty-cart h2 {
      margin: 1rem 0;
      font-size: 2rem;
    }

    .empty-cart p {
      color: #6e6e73;
      margin-bottom: 2rem;
    }

    .cart-summary {
      background: #f9f9fb;
      padding: 2rem;
      border-radius: 32px;
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    body.dark .cart-summary { background: #1d1d20; }

    .cart-summary h3 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 1rem 0;
      color: #6e6e73;
    }

    .summary-divider {
      height: 1px;
      background: #e5e5ea;
      margin: 1.5rem 0;
    }

    body.dark .summary-divider {
      background: rgba(255,255,255,0.1);
    }

    .summary-total {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1d1c1f;
    }

    body.dark .summary-total { color: #f5f5f7; }

    .checkout-btn {
      width: 100%;
      padding: 1.2rem;
      background: #1d1c1f;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .checkout-btn:hover {
      background: #333;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    body.dark .checkout-btn {
      background: #f5f5f7;
      color: #101010;
    }

    .continue-shopping {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s;
    }

    .continue-shopping:hover {
      gap: 0.8rem;
      transform: translateX(5px);
    }

    .cta-button {
      display: inline-block;
      background: #1d1c1f;
      color: white;
      font-size: 1.1rem;
      font-weight: 500;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .cta-button:hover {
      background: #333;
      transform: translateY(-2px) scale(1.02);
    }

    .footer {
      background: #f5f5f7;
      padding: 3rem 5% 2rem;
      margin-top: 4rem;
      text-align: center;
      color: #6e6e73;
    }

    body.dark .footer { background: #151517; }

    /* Animation classes */
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .fade-up.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }

    @media (max-width: 900px) {
      .cart-container {
        grid-template-columns: 1fr;
      }
      .cart-item {
        grid-template-columns: 60px 1fr;
        gap: 1rem;
      }
      .cart-item-quantity,
      .cart-item-price,
      .cart-item-total {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="index.html">orion</a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="tech.html">Tech</a>
      <a href="cart.html"><i class="fa-solid fa-bag-shopping"></i></a>
      <a href="account.html"><i class="fa-regular fa-user"></i></a>
      <button class="dark-toggle" id="darkToggle"><i class="fa-regular fa-moon"></i></button>
    </div>
  </nav>

  <section class="cart-section">
    <h1 class="page-title fade-up">Your Bag</h1>
    
    <div class="cart-container">
      <div class="cart-items fade-up" id="cartItems">
        <!-- Items populated by JS -->
      </div>

      <div class="cart-summary fade-up">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">$0</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span id="shipping">Free</span>
        </div>
        <div class="summary-row">
          <span>Tax</span>
          <span id="tax">$0</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="total">$0</span>
        </div>
        <button class="checkout-btn">
          <i class="fa-solid fa-lock"></i> Checkout
        </button>
        <a href="shop.html" class="continue-shopping">Continue Shopping</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    © 2025 Orion. All rights reserved.
  </footer>

  <script>
    // Dark mode
    const darkToggle = document.getElementById('darkToggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('orionTheme');
    if (savedTheme === 'dark') {
      body.classList.add('dark');
      darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
    }
    darkToggle.addEventListener('click', () => {
      body.classList.toggle('dark');
      const isDark = body.classList.contains('dark');
      localStorage.setItem('orionTheme', isDark ? 'dark' : 'light');
      darkToggle.querySelector('i').classList.toggle('fa-moon');
      darkToggle.querySelector('i').classList.toggle('fa-sun');
    });

    // Load cart
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('orionCart') || '[]');
      const container = document.getElementById('cartItems');
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <i class="fa-solid fa-bag-shopping"></i>
            <h2>Your bag is empty</h2>
            <p>Add some amazing audio products to get started.</p>
            <a href="shop.html" class="cta-button">Browse Products</a>
          </div>
        `;
        updateSummary(0, 0);
        return;
      }
      
      container.innerHTML = cart.map((item, index) => `
        <div class="cart-item fade-up">
          <div class="cart-item-image">${item.image}</div>
          <div class="cart-item-details">
            <h3>${item.name}</h3>
            <p>Color: ${item.color}</p>
          </div>
          <div class="cart-item-price">$${item.price}</div>
          <div class="cart-item-quantity">
            <button onclick="updateQuantity(${index}, -1)">−</button>
            <span>${item.quantity}</span>
            <button onclick="updateQuantity(${index}, 1)">+</button>
          </div>
          <div class="cart-item-total">$${item.price * item.quantity}</div>
          <button class="cart-item-remove" onclick="removeItem(${index})">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      `).join('');
      
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const tax = subtotal * 0.08;
      updateSummary(subtotal, tax);

      // Re-observe new items
      document.querySelectorAll('.cart-item.fade-up').forEach(el => observer.observe(el));
    }

    function updateQuantity(index, delta) {
      const cart = JSON.parse(localStorage.getItem('orionCart') || '[]');
      cart[index].quantity += delta;
      if (cart[index].quantity < 1) cart[index].quantity = 1;
      localStorage.setItem('orionCart', JSON.stringify(cart));
      loadCart();
    }

    function removeItem(index) {
      const cart = JSON.parse(localStorage.getItem('orionCart') || '[]');
      cart.splice(index, 1);
      localStorage.setItem('orionCart', JSON.stringify(cart));
      loadCart();
    }

    function updateSummary(subtotal, tax) {
      document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
      document.getElementById('tax').textContent = '$' + tax.toFixed(2);
      document.getElementById('total').textContent = '$' + (subtotal + tax).toFixed(2);
    }

    // Intersection Observer for animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
        }
      });
    }, { threshold: 0.2, rootMargin: '0px 0px -50px 0px' });

    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

    loadCart();
  </script>
</body>
</html>
