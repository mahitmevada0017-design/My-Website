```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Orion Audio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#fff;
  color:#1d1c1f;
}

body.dark{
  background:#101010;
  color:#f5f5f7;
}

.navbar{
  display:flex;
  justify-content:space-between;
  padding:1rem 5%;
  background:#fff;
}

.checkout{
  max-width:1100px;
  margin:auto;
  padding:2rem;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:2rem;
}

.card{
  background:#f9f9fb;
  padding:2rem;
  border-radius:20px;
}

body.dark .card{
  background:#1d1d20;
}

input,select{
  width:100%;
  padding:0.8rem;
  margin-top:0.5rem;
  border-radius:10px;
  border:1px solid #ccc;
}

.form-group{
  margin-bottom:1rem;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1rem;
}

button{
  width:100%;
  padding:1rem;
  border:none;
  background:#667eea;
  color:#fff;
  border-radius:30px;
  cursor:pointer;
  font-size:1rem;
}

.order-item{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}

.total{
  font-weight:bold;
  font-size:1.2rem;
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="checkout">
<h1>Checkout</h1>

<div class="grid">

<!-- ORDER SUMMARY -->
<div class="card">
<h2>Your Order</h2>
<div id="orderItems"></div>

<p>Subtotal: <span id="subtotal">$0</span></p>
<p>Tax: <span id="tax">$0</span></p>
<p class="total">Total: <span id="total">$0</span></p>
</div>

<!-- FORM -->
<div class="card">
<h2>Payment</h2>

<form onsubmit="placeOrder(event)">

<div class="form-group">
<label>Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Card Number</label>
<input type="text" id="card" maxlength="19" placeholder="1234 5678 9012 3456" required>
</div>

<div class="row">
<div class="form-group">
<label>Expiry</label>
<input type="text" id="expiry" maxlength="5" placeholder="MM/YY" required>
</div>

<div class="form-group">
<label>CVC</label>
<input type="text" id="cvc" maxlength="3" required>
</div>
</div>

<div class="form-group">
<label>Country</label>
<select id="country" required>
<option value="">Select</option>
<option>India</option>
<option>USA</option>
<option>UK</option>
</select>
</div>

<button type="submit">Place Order</button>

</form>
</div>

</div>
</div>

<script>

// DARK MODE
const body = document.body;
if(localStorage.getItem("theme")==="dark"){
  body.classList.add("dark");
}

// LOAD CART
function loadOrderSummary(){
  const cart = JSON.parse(localStorage.getItem("orionCart")||"[]");
  const div = document.getElementById("orderItems");

  let subtotal=0;

  div.innerHTML = cart.map(item=>{
    subtotal += item.price * item.quantity;
    return `<div class="order-item">
      <span>${item.name} x${item.quantity}</span>
      <span>$${item.price * item.quantity}</span>
    </div>`;
  }).join("");

  const tax = subtotal * 0.08;
  const total = subtotal + tax;

  document.getElementById("subtotal").innerText="$"+subtotal.toFixed(2);
  document.getElementById("tax").innerText="$"+tax.toFixed(2);
  document.getElementById("total").innerText="$"+total.toFixed(2);
}

// FORMAT CARD
document.getElementById("card").addEventListener("input",e=>{
  let v = e.target.value.replace(/\D/g,"");
  v = v.replace(/(.{4})/g,"$1 ").trim();
  e.target.value=v;
});

// FORMAT EXPIRY
document.getElementById("expiry").addEventListener("input",e=>{
  let v = e.target.value.replace(/\D/g,"");
  if(v.length>=2){
    v = v.slice(0,2)+"/"+v.slice(2,4);
  }
  e.target.value=v;
});

// PLACE ORDER
function placeOrder(e){
  e.preventDefault();

  alert("✅ Order placed successfully!");
  localStorage.removeItem("orionCart");
  window.location.href="account.html";
}

loadOrderSummary();

</script>

</body>
</html>
